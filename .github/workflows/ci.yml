name: CI

on:
  push:
    branches: [prod]
  pull_request:

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @musegui/daemon --workspace @musegui/ui --workspace @musegui/server
      - run: npm run test --workspace @musegui/daemon --workspace @musegui/ui --workspace @musegui/server
      - run: npm run build --workspace @musegui/web
      - run: npm run test --workspace @musegui/web
      # The editor extension: bundles the server and UI, then starts the bundle and checks it serves both.
      - run: npm run test --workspace musegui
      # PowerShell scripts in scripts/ are only run by hand on Windows, so at least make sure they parse.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=scripts/$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  # The desktop crate is only otherwise compiled while cutting a release, which is far too late to
  # find out that it does not build.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Tauri links WebKitGTK and friends, which the Ubuntu runner does not ship.
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run build --workspace @musegui/daemon --workspace @musegui/ui --workspace @musegui/server
      - run: npm run build --workspace @musegui/web
      # tauri-build checks every path in bundle.resources before it compiles anything, and those are
      # built rather than committed. This is what the release does through beforeBuildCommand.
      - run: npm run bundle:server --workspace musegui-desktop
      # bundle.externalBin is checked the same way, so fetch the Node.js sidecar too.
      - run: npm run fetch:node --workspace musegui-desktop
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
