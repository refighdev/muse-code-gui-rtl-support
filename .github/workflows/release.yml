name: Release

# Builds the signed-for-updates desktop installers on every version tag (Windows, macOS universal, Linux AppImage) and the
# editor extension (.vsix), and attaches them to a GitHub Release. Or run it by hand on an existing tag:
#   gh workflow run release.yml --ref v0.1.1
# Needs the repository secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build --workspace @musegui/daemon --workspace @musegui/ui --workspace @musegui/server
      # Pinned to a commit: this step holds the updater signing key, so a moved tag must not change what runs.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Which Node.js sidecar beforeBuildCommand bundles (apps/desktop/scripts/fetch-node.mjs).
          MUSEGUI_NODE_TARGET: x86_64-pc-windows-msvc
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer for the in-app updater, which also publishes latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Muse Code GUI ${{ github.ref_name }}"
          releaseBody: "Right-to-left (Persian, Arabic, Hebrew) support throughout. Bundles Node.js, so the only requirement is the Muse CLI with muse login (Muse for Windows natively, or inside WSL2). Windows and macOS builds are not code signed or notarized: on Windows click More info, then Run anyway; on macOS 15 or later use System Settings > Privacy & Security > Open Anyway (or run: xattr -dr com.apple.quarantine /Applications/MuseCodeGUI.app). Unofficial; not affiliated with Meta."
          releaseDraft: false
          # A full release, so the updater's releases/latest/download/latest.json always points at it.
          prerelease: false
          # GitHub sometimes refuses a large asset upload ("Error saving asset"); retrying saves a manual job rerun.
          retryAttempts: 3
          args: --target x86_64-pc-windows-msvc

  desktop-macos:
    permissions:
      contents: write
    # After Windows, not beside it: both jobs merge their platform into the release's latest.json,
    # which is a read-modify-write that concurrent jobs could clobber, silently dropping a platform
    # from auto-update.
    needs: desktop-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin needs both halves installed; aarch64 is already the runner default.
          targets: x86_64-apple-darwin
      - run: npm ci
      - run: npm run build --workspace @musegui/daemon --workspace @musegui/ui --workspace @musegui/server
      # Pinned to a commit: this step holds the updater signing key, so a moved tag must not change what runs.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Which Node.js sidecar beforeBuildCommand bundles (apps/desktop/scripts/fetch-node.mjs).
          MUSEGUI_NODE_TARGET: universal-apple-darwin
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer for the in-app updater, which also publishes latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Muse Code GUI ${{ github.ref_name }}"
          releaseBody: "Right-to-left (Persian, Arabic, Hebrew) support throughout. Bundles Node.js, so the only requirement is the Muse CLI with muse login (Muse for Windows natively, or inside WSL2). Windows and macOS builds are not code signed or notarized: on Windows click More info, then Run anyway; on macOS 15 or later use System Settings > Privacy & Security > Open Anyway (or run: xattr -dr com.apple.quarantine /Applications/MuseCodeGUI.app). Unofficial; not affiliated with Meta."
          releaseDraft: false
          # A full release, so the updater's releases/latest/download/latest.json always points at it.
          prerelease: false
          # GitHub sometimes refuses a large asset upload ("Error saving asset"); retrying saves a manual job rerun.
          retryAttempts: 3
          # One universal binary for Apple Silicon and Intel; the macOS bundles come from tauri.macos.conf.json.
          args: --target universal-apple-darwin

  desktop-linux:
    permissions:
      contents: write
    needs: desktop-macos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev squashfs-tools
      - run: npm ci
      - run: npm run build --workspace @musegui/daemon --workspace @musegui/ui --workspace @musegui/server
      # Pinned to a commit: this step holds the updater signing key, so a moved tag must not change what runs.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Which Node.js sidecar beforeBuildCommand bundles (apps/desktop/scripts/fetch-node.mjs).
          MUSEGUI_NODE_TARGET: x86_64-unknown-linux-gnu
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer for the in-app updater, which also publishes latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Muse Code GUI ${{ github.ref_name }}"
          releaseBody: "Right-to-left (Persian, Arabic, Hebrew) support throughout. Bundles Node.js, so the only requirement is the Muse CLI with muse login (Muse for Windows natively, or inside WSL2). Windows and macOS builds are not code signed or notarized: on Windows click More info, then Run anyway; on macOS 15 or later use System Settings > Privacy & Security > Open Anyway (or run: xattr -dr com.apple.quarantine /Applications/MuseCodeGUI.app). Unofficial; not affiliated with Meta."
          releaseDraft: false
          # A full release, so the updater's releases/latest/download/latest.json always points at it.
          prerelease: false
          # GitHub sometimes refuses a large asset upload ("Error saving asset"); retrying saves a manual job rerun.
          retryAttempts: 3
          args: --target x86_64-unknown-linux-gnu
      # linuxdeploy bundles Ubuntu 22.04's libwayland-*. Newer host Mesa fails EGL init
      # against the stale copy, so WebKitGTK aborts with EGL_BAD_ALLOC before the window
      # opens (tauri-apps/tauri#15665). Repack without those libraries so the AppImage
      # uses the host ones, then re-sign and republish it.
      - name: Strip bundled Wayland libraries from AppImage
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          # gh infers the repository from the git remote, and $work is not a checkout.
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.AppImage" --clobber
          appimage=(MuseCodeGUI_*_amd64.AppImage)
          # A downloaded release asset does not keep its executable bit.
          chmod +x "${appimage[0]}"
          "./${appimage[0]}" --appimage-extract
          rm -f squashfs-root/usr/lib/libwayland-client.so.0 squashfs-root/usr/lib/libwayland-cursor.so.0 \
            squashfs-root/usr/lib/libwayland-egl.so.1 squashfs-root/usr/lib/libwayland-server.so.0
          curl -sSL --fail -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum --check
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "${appimage[0]}"
          "${{ github.workspace }}/node_modules/.bin/tauri" signer sign "${appimage[0]}"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "latest.json" --clobber
          SIG_FILE="${appimage[0]}.sig" node -e '
            const fs = require("fs");
            const latest = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            const signature = fs.readFileSync(process.env.SIG_FILE, "utf8").trim();
            for (const platform of ["linux-x86_64", "linux-x86_64-appimage"]) {
              latest.platforms[platform].signature = signature;
            }
            fs.writeFileSync("latest.json", JSON.stringify(latest, null, 2));
          '
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${appimage[0]}" "${appimage[0]}.sig" latest.json --clobber
      # The editor extension, attached to the same release so it can be installed with "Install from VSIX...".
      - name: Build the editor extension
        run: |
          npm run build --workspace @musegui/web
          npm run package --workspace musegui
      - name: Attach the extension to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "apps/vscode/musegui.vsix#muse-code-gui-${{ github.ref_name }}.vsix" --clobber
